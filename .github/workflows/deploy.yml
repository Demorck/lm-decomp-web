name: Update progress and deploy

on:
    schedule:
        - cron: "17 * * * *"
    workflow_dispatch:
    push:
        branches: [master]

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            changed: ${{ steps.commit.outputs.changed }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Fetch new upstream reports
              run: node scripts/update-data.ts
              env:
                  GITHUB_TOKEN: ${{ secrets.UPSTREAM_TOKEN || secrets.GITHUB_TOKEN }}

            - name: Commit data
              id: commit
              run: |
                  git add public/data
                  if git diff --cached --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update progress data"
                  git push
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Build site
              if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
              run: |
                  npm ci
                  npm run build

            - name: Upload site
              if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
